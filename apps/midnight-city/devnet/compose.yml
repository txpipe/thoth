# Local ledger-9 devnet: one dev-preset node, a standalone indexer and a proof
# server, ported from midnight-reference-app's ledger-8 compose. This is the
# newest set that deploys and records an attestation (README "Version set").
# Wallet SDK 5 needs indexer 4.4.0-rc.5, which is published only to a private
# registry, so compose builds it from its public source tag on first `up`.
name: thoth-devnet

services:
  node:
    image: 'midnightntwrk/midnight-node:2.1.0-beta.1'
    ports:
      - '9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  indexer:
    image: 'thoth-local/indexer-standalone:4.4.0-rc.5'
    build:
      context: 'https://github.com/midnightntwrk/midnight-indexer.git#v4.4.0-rc.5'
      dockerfile: 'indexer-standalone/Dockerfile'
      args:
        RUST_VERSION: '1.95.0'
    ports:
      - '8088:8088'
    env_file: standalone.env
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: 'midnightntwrk/proof-server:9.0.0-rc.9'
    command: ['midnight-proof-server --verbose']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
