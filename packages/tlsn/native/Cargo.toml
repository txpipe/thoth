[package]
name = "thoth-tlsn"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "TLSNotary notary, prover and presentation verifier for the Thoth tlsn@1 kind."
publish = false

[[bin]]
name = "thoth-tlsn"
path = "src/main.rs"

[dependencies]
# Pin one TLSNotary release: the attestation and presentation formats change between releases.
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1", features = ["mozilla-certs"] }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1" }

anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-std", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[profile.release]
# MPC-TLS is CPU-bound; an unoptimized prover or notary is impractically slow.
opt-level = 3
