version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned with the Compact compiler; see CONTRIBUTING.md#dev-setup.
      - dependency-name: '@midnight-ntwrk/compact-runtime'
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
