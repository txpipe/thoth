name: Test Suite

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'biome.json'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'biome.json'

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Compact
        uses: ./.github/actions/setup-compact

      - name: Compile contract artifacts
        run: npm run compact:no-zk

      - name: Build
        run: npm run build

      - name: Run type checks
        run: npm run types

      - name: Run tests
        run: npx vitest run