<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="D: proof server, proving time by CPU allocation">
